name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-msvc-x64:
    name: Windows MSVC x64
    runs-on: windows-latest

    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check out vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: vcpkg

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\vcpkg\bootstrap-vcpkg.bat

      - name: Download runtime assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download assets-v1 --repo ${{ github.repository }} --pattern tetris-runtime-assets-v1.zip --dir runtime-assets

      - name: Extract runtime assets
        shell: pwsh
        run: Expand-Archive -LiteralPath runtime-assets\tetris-runtime-assets-v1.zip -DestinationPath runtime-assets\extracted -Force

      - name: Configure
        run: cmake --preset windows-msvc-x64 -DTETRIS_ASSET_DIR="${{ github.workspace }}\runtime-assets\extracted"

      - name: Build
        run: cmake --build --preset windows-msvc-x64-release

      - name: Package
        run: cpack --preset windows-msvc-x64-release

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: tetris-windows-msvc-x64
          path: build/windows-msvc-x64/*.zip
          if-no-files-found: error

  linux-x64:
    name: Linux x64
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libsdl2-dev \
            libsdl2-ttf-dev \
            libsdl2-mixer-dev

      - name: Download runtime assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download assets-v1 --repo ${{ github.repository }} --pattern tetris-runtime-assets-v1.zip --dir runtime-assets

      - name: Extract runtime assets
        run: unzip -q runtime-assets/tetris-runtime-assets-v1.zip -d runtime-assets/extracted

      - name: Configure
        run: cmake --preset linux-release -DTETRIS_ASSET_DIR="${{ github.workspace }}/runtime-assets/extracted"

      - name: Build
        run: cmake --build --preset linux-release

      - name: Package
        run: cpack --preset linux-release

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: tetris-linux-x64
          path: build/linux-release/*.tar.gz
          if-no-files-found: error

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs:
      - windows-msvc-x64
      - linux-x64
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Validate version tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9._-]+)?$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-artifacts/tetris-windows-msvc-x64/*.zip \
            release-artifacts/tetris-linux-x64/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Automated Tetris release for $GITHUB_REF_NAME."
